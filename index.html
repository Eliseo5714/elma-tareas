<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elma tareas">
<meta name="application-name" content="Elma tareas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mantenimiento y limpieza</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));background:#f6f7f9;color:#1d2330;max-width:1200px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0}
h3{font-size:14px;margin:14px 0 6px;color:#445}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sub{color:#667;margin:4px 0 0}
section{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 2px #0001}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar label{font-size:13px;color:#445;display:flex;gap:6px;align-items:center}
.bar select{font:inherit;padding:6px;border:1px solid #bbc;border-radius:6px;background:#fff}
#rangoTxt{min-width:150px;text-align:center;font-weight:600}
.seg button.on{background:#1d2330;color:#fff;border-color:#1d2330}
.muted{color:#778;font-size:14px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:4px;min-width:100%}
.dh{font-size:12px;color:#667;font-weight:600;text-align:center;padding:4px 0}
.dh.hoy{color:#1d2330;text-decoration:underline}
.rh{font-weight:700;display:flex;align-items:center;font-size:15px}
.cel{min-height:60px;border-radius:8px;background:#f2f4f7;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:120px}
.cel:hover{background:#e3e8ef}
.cel.hoy{outline:2px solid #1d2330}
.cnt{font-size:12px;color:#aab;margin:auto}
.chip{font-size:12px;padding:3px 6px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.lim{background:#1f7a3d}
.chip.man{background:#2563eb}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #bbc;background:#fff;cursor:pointer}
.primary{background:#1d2330;color:#fff;border-color:#1d2330}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10}
.ov[hidden]{display:none}
.mod{background:#fff;border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;position:relative}
.mod h3{font-size:18px;margin:0 30px 6px 0;color:#1d2330}
.cerrar{position:absolute;right:10px;top:8px;border:0;background:none;font-size:26px;cursor:pointer;padding:0 6px}
.mod input,.mod select,.login input{width:100%;padding:10px;margin:4px 0;border:1px solid #ccd;border-radius:6px;font:inherit}
.tarea{display:flex;justify-content:space-between;gap:8px;padding:8px;border-radius:8px;margin:6px 0;align-items:center;flex-wrap:wrap;font-size:14px}
.tarea.pend{background:#fde8e6}
.tarea.ok{background:#e6f4ea}
.nueva{display:grid;gap:4px;margin-top:6px}
.msg{font-size:13px;color:#2563eb;min-height:18px;margin-top:6px}
.err{color:#b42318}
.login{max-width:360px;margin:12vh auto 0;background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 2px #0001}
.login button{width:100%;margin-top:8px;padding:10px}
.login[hidden],#app[hidden],.ov[hidden]{display:none}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1>Mantenimiento y limpieza</h1>
  <p class="sub">Acceso del equipo · Apartamentos Elma</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button type="submit" class="primary">Entrar</button>
  </form>
  <button type="button" class="primary" id="googleBtn" style="background:#fff;color:#1d2330;border:1px solid #ccc">Continuar con Google</button>
  <div id="loginMsg" class="msg err"></div>
</div>

<div id="app" hidden>
  <div class="top">
    <div>
      <h1>Mantenimiento y limpieza</h1>
      <p class="sub">Apartamentos Elma · Castelldefels</p>
    </div>
    <div class="acc"><span id="who" class="muted"></span><button id="salir">Salir</button></div>
  </div>

  <section>
    <div class="bar seg">
      <button data-m="hoy">Hoy</button>
      <button data-m="manana">Mañana</button>
      <button data-m="pasado">Pasado mañana</button>
      <button data-m="semana">Semana actual</button>
    </div>
    <div class="bar">
      <button id="prev" aria-label="Anterior">‹</button>
      <b id="rangoTxt"></b>
      <button id="next" aria-label="Siguiente">›</button>
    </div>
    <div class="bar">
      <label>Tipo <select id="fTipo"><option>Todos</option><option>Limpieza</option><option>Mantenimiento</option></select></label>
      <label>Apartamento <select id="fApto"></select></label>
      <span id="resumenTxt" class="muted"></span>
    </div>
    <div class="wrap"><div id="grid"></div></div>
  </section>

  <div id="ov" class="ov" hidden>
    <div class="mod" role="dialog" aria-modal="true">
      <button id="cerrar" class="cerrar" aria-label="Cerrar">×</button>
      <h3 id="modTitulo"></h3>
      <h3>Pendientes</h3>
      <div id="pend"></div>
      <h3>Hechas</h3>
      <div id="hechas"></div>
      <button id="borrarHechas" hidden style="margin-top:6px"></button>
      <h3>Añadir tarea</h3>
      <div class="nueva">
        <select id="nTipo"><option>Limpieza</option><option>Mantenimiento</option></select>
        <input id="nTexto" placeholder="Qué hay que hacer">
        <input id="nFecha" type="date">
        <button id="addBtn" class="primary">Añadir</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://pdscmiqnwnhwjflhhkde.supabase.co';
const SUPABASE_KEY='sb_publishable_zgT5RwiOD7sNpqSeRs6rRw_yioXaNyf';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const APTS=['1A','1B','1C','2A','2B','2C','3A','3B','3C'];
const DIAS=['L','M','X','J','V','S','D'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoyIso=iso(new Date());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=f=>f.slice(8,10)+'/'+f.slice(5,7);
const byCreada=(a,b)=>(a.creada||'').localeCompare(b.creada||'');

let tareas=[], modo='hoy', desp=0, fTipo='Todos', fApto='Todos';
let abierto=null, armado=null, canal=null, sesionEmail='', guardando=false;

function rangoActual(){
  const hoy=new Date(); hoy.setHours(12,0,0,0);
  const ini=new Date(hoy);
  if(modo==='semana'){
    const dow=(hoy.getDay()+6)%7;
    ini.setDate(hoy.getDate()-dow+desp*7);
    return {ini,n:7};
  }
  const off={hoy:0,manana:1,pasado:2}[modo]+desp;
  ini.setDate(hoy.getDate()+off);
  return {ini,n:1};
}
function diasRango(){
  const {ini,n}=rangoActual();
  const out=[];
  for(let i=0;i<n;i++){ const d=new Date(ini); d.setDate(ini.getDate()+i); out.push(iso(d)); }
  return out;
}
function pendientes(apto,f){
  return tareas.filter(t=>t.apto===apto&&t.fecha===f&&t.estado==='pendiente'&&(fTipo==='Todos'||t.tipo===fTipo)).sort(byCreada);
}

async function load(){
  const {data,error}=await sb.from('tareas').select('*');
  if(error){ $('grid').innerHTML='<p class="err">Error al leer las tareas: '+esc(error.message)+'</p>'; return; }
  tareas=data||[];
  pintarTodo();
}
function pintarTodo(){ pintarGrid(); if(abierto) renderMod(); }

function pintarGrid(){
  const dias=diasRango();
  const aptos=fApto==='Todos'?APTS:[fApto];
  $('rangoTxt').textContent=fmt(dias[0])+' – '+fmt(dias[dias.length-1]);
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===modo));
  let total=0;
  let h='<div class="grid" style="grid-template-columns:70px repeat('+dias.length+',minmax(120px,1fr))"><div></div>';
  h+=dias.map(f=>{ const d=new Date(f+'T12:00'); return '<div class="dh'+(f===hoyIso?' hoy':'')+'">'+DIAS[(d.getDay()+6)%7]+' '+fmt(f)+'</div>'; }).join('');
  aptos.forEach(a=>{
    h+='<div class="rh">'+a+'</div>';
    h+=dias.map(f=>{
      const p=pendientes(a,f); total+=p.length;
      const chips=p.map(t=>'<span class="chip '+(t.tipo==='Limpieza'?'lim':'man')+'" title="'+esc(t.tipo)+'">'+esc(t.descripcion)+'</span>').join('');
      return '<div class="cel'+(f===hoyIso?' hoy':'')+'" data-apto="'+a+'" data-f="'+f+'">'+chips+(p.length?'':'<span class="cnt">—</span>')+'</div>';
    }).join('');
  });
  h+='</div>';
  $('grid').innerHTML=h;
  $('resumenTxt').textContent=total+' pendiente'+(total===1?'':'s')+' en este rango';
}

function filaTarea(t,hecha){
  const quien=hecha&&t.hecha_por?' · hecha por '+esc(t.hecha_por):'';
  const bHecha=hecha?'<button data-act="reabrir" data-id="'+t.id+'">Reabrir</button>':'<button data-act="hecha" data-id="'+t.id+'">Hecha</button>';
  const bDel='<button data-act="borrar" data-id="'+t.id+'">'+(armado==='b:'+t.id?'¿Seguro?':'Borrar')+'</button>';
  return '<div class="tarea '+(hecha?'ok':'pend')+'"><span><b>'+esc(t.tipo)+'</b> · '+esc(t.descripcion)+quien+'</span><span class="acc">'+bHecha+bDel+'</span></div>';
}
function renderMod(){
  if(!abierto) return;
  const ts=tareas.filter(t=>t.apto===abierto.apto&&t.fecha===abierto.f).sort(byCreada);
  const pe=ts.filter(t=>t.estado==='pendiente'), he=ts.filter(t=>t.estado==='hecho');
  $('modTitulo').textContent=abierto.apto+' · '+fmt(abierto.f);
  $('pend').innerHTML=pe.length?pe.map(t=>filaTarea(t,false)).join(''):'<p class="muted">Sin tareas pendientes.</p>';
  $('hechas').innerHTML=he.length?he.map(t=>filaTarea(t,true)).join(''):'<p class="muted">Ninguna hecha todavía.</p>';
  $('borrarHechas').hidden=!he.length;
  $('borrarHechas').textContent=armado==='hechas'?'¿Seguro? Pulsa otra vez':'Borrar hechas ('+he.length+')';
}

function abrir(apto,f){
  abierto={apto,f}; armado=null;
  $('nTipo').value=fTipo!=='Todos'?fTipo:'Limpieza';
  $('nFecha').value=f; $('nTexto').value=''; $('msg').textContent='';
  $('ov').hidden=false;
  renderMod();
}
function cerrar(){ abierto=null; armado=null; $('ov').hidden=true; }

function armar(clave,redibujar){
  if(armado!==clave){
    armado=clave; redibujar();
    setTimeout(()=>{ if(armado===clave){ armado=null; redibujar(); } },4000);
    return false;
  }
  armado=null; return true;
}

$('grid').addEventListener('click',e=>{
  const c=e.target.closest('.cel');
  if(c) abrir(c.dataset.apto,c.dataset.f);
});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ modo=b.dataset.m; desp=0; pintarGrid(); });
$('prev').onclick=()=>{ desp--; pintarGrid(); };
$('next').onclick=()=>{ desp++; pintarGrid(); };
$('fTipo').onchange=()=>{ fTipo=$('fTipo').value; pintarGrid(); };
$('fApto').onchange=()=>{ fApto=$('fApto').value; pintarGrid(); };
$('cerrar').onclick=cerrar;
$('ov').addEventListener('click',async e=>{
  if(e.target===$('ov')){ cerrar(); return; }
  const b=e.target.closest('button[data-act]');
  if(!b||guardando) return;
  const id=b.dataset.id, act=b.dataset.act;
  if(act==='borrar'){
    if(!armar('b:'+id,renderMod)) return;
    await sb.from('tareas').delete().eq('id',id);
  }else if(act==='hecha'){
    await sb.from('tareas').update({estado:'hecho',hecha_por:sesionEmail,hecha_en:new Date().toISOString(),actualizada:new Date().toISOString()}).eq('id',id);
  }else if(act==='reabrir'){
    await sb.from('tareas').update({estado:'pendiente',hecha_por:null,hecha_en:null,actualizada:new Date().toISOString()}).eq('id',id);
  }
  await load();
});
$('borrarHechas').onclick=async()=>{
  if(!armar('hechas',renderMod)) return;
  const ids=tareas.filter(t=>t.apto===abierto.apto&&t.fecha===abierto.f&&t.estado==='hecho').map(t=>t.id);
  if(ids.length) await sb.from('tareas').delete().in('id',ids);
  await load();
};
$('addBtn').onclick=async()=>{
  if(!abierto||guardando) return;
  const texto=$('nTexto').value.trim(), fecha=$('nFecha').value;
  if(!texto){ $('msg').textContent='Escribe qué hay que hacer.'; return; }
  if(!fecha){ $('msg').textContent='Elige una fecha.'; return; }
  guardando=true; $('addBtn').disabled=true; $('msg').textContent='Guardando…';
  const ahora=new Date().toISOString();
  const {error}=await sb.from('tareas').insert({id:crypto.randomUUID(),apto:abierto.apto,tipo:$('nTipo').value,descripcion:texto,fecha,estado:'pendiente',creada:ahora,actualizada:ahora});
  guardando=false; $('addBtn').disabled=false;
  if(error){ $('msg').textContent='No se pudo guardar: '+error.message; return; }
  $('nTexto').value=''; $('msg').textContent='';
  await load();
};

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  $('loginMsg').textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('loginMsg').textContent=error?'Correo o contraseña incorrectos.':'';
  if(!error) $('pass').value='';
});
$('googleBtn').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
$('salir').onclick=()=>sb.auth.signOut();

function suscribir(){
  if(canal) return;
  canal=sb.channel('tareas-cambios').on('postgres_changes',{event:'*',schema:'public',table:'tareas'},()=>load()).subscribe();
}

$('fApto').innerHTML='<option>Todos</option>'+APTS.map(a=>'<option>'+a+'</option>').join('');

sb.auth.onAuthStateChange(async (_evento,session)=>{
  if(session){
    sesionEmail=session.user.email;
    $('login').hidden=true; $('app').hidden=false;
    $('who').textContent=sesionEmail;
    pintarGrid();
    await load();
    suscribir();
  }else{
    sesionEmail='';
    $('app').hidden=true; $('login').hidden=false;
    if(canal){ sb.removeChannel(canal); canal=null; }
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
